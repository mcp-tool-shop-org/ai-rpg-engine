# Coverage is enforced here at the 90% bar: project status targets 90% (with a
# 1% threshold) and patch status targets 90% of changed lines, so regressions
# fail their status checks. The pull-request comment carries patch coverage and
# test results; the repository-wide percentage stays out of it.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: true
  require_changes: false
