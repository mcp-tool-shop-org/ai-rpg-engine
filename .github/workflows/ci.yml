name: CI

permissions:
  contents: read

on:
  push:
    paths:
      - 'packages/**'
      - 'templates/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.tests.json'
      - 'Dockerfile'
      - 'vitest.config.ts'
      - 'eslint.config.js'
      - 'docs/examples/**'
      - 'docs/check-docs-integrity.mjs'
      - 'docs/mixed-game-viability-proof.ts'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'packages/**'
      - 'templates/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.tests.json'
      - 'Dockerfile'
      - 'vitest.config.ts'
      - 'eslint.config.js'
      - 'docs/examples/**'
      - 'docs/check-docs-integrity.mjs'
      - 'docs/mixed-game-viability-proof.ts'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        # Node 20 reached EOL 2026-04-30. Matrix is current LTS (24) plus the
        # previous LTS (22) as the single-leg gate runner. Root engines is
        # still ">=20" (package.json is outside this workflow's bump).
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      # Audit GATES on high/critical advisories in production deps (--omit=dev):
      # a real advisory in a shipped dependency now fails CI. Dev-only tooling is
      # excluded because the sole current high advisory (vitest /
      # @vitest/coverage-v8, GHSA-5xrq-8626-4rwp) only triggers when the Vitest
      # UI server is listening — CI runs `vitest run` (no UI), so it is not
      # exploitable here, and gating it would force a breaking vitest 3->4 major
      # bump for zero consumer risk. Drop `--omit=dev` (audit the full tree)
      # when that bump lands.
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm run build
      # Doc examples (docs/examples/*.ts) are compiled against the just-built
      # packages so README/handbook "runnable" snippets cannot drift from the API.
      - name: Typecheck doc examples
        run: npx tsc -p docs/examples/tsconfig.json --noEmit
      # Test-file typecheck gate (PROD-008): every package tsconfig excludes
      # src/**/*.test.ts (tests must not ship in dist), so `npm run build`
      # never sees test files and type errors in them accumulated silently —
      # 203 had piled up when this gate landed. tsconfig.tests.json is a flat
      # noEmit config over packages/*/src INCLUDING tests; cross-package
      # imports resolve against the dist/*.d.ts the build step just produced,
      # which is why this runs after build. One leg only — the check is
      # node-version independent, same as the packaging gate below.
      - name: Typecheck test files
        if: matrix.node-version == 22
        run: npm run typecheck:tests
      # Doc examples are also BEHAVIOR-tested (examples.test.ts), but the root
      # vitest config only includes packages/*, templates/*, and scripts/* — the
      # examples' tests run solely via their dedicated config. Executing them
      # here (after the build, so they resolve the just-built packages) makes the
      # README's "type-checked + behavior-tested" claim enforced in CI rather
      # than local-only. One leg only — the tests are node-version independent.
      - name: Behavior-test doc examples
        if: matrix.node-version == 22
        run: npx vitest run --config docs/examples/vitest.config.ts
      # docs/mixed-game-viability-proof.ts headlines itself as a "Release
      # Gate" architecture test (4 archetypes / 6 encounter modes coexisting
      # on one stat model, one combat stack, one world), but nothing invoked
      # it — the label was aspirational, not enforced. This step makes it
      # true. See scripts/verify-mixed-game-viability.mjs for why "compiles
      # + runs without throwing" is the proof's actual pass condition. One
      # leg only — node-version independent, same as the packaging gate below.
      - name: Release gate — mixed-game viability proof
        if: matrix.node-version == 22
        run: node scripts/verify-mixed-game-viability.mjs
      # Packaging gate (PG-5): every publishable workspace's `npm pack` tarball
      # must contain LICENSE + README.md. npm silently drops `files` entries
      # that don't exist on disk, so only inspecting the dry-run file list
      # catches a missing file (this is how the G3 LICENSE gap shipped).
      # One leg only — the check is node-version independent.
      - name: Packaging gate (LICENSE/README in every publishable tarball)
        if: matrix.node-version == 22
        run: node scripts/check-packaging.mjs
      # Packed-tarball consumer proof (SHIP_GATE §F): pack every non-private
      # workspace, install outside the monorepo, typecheck + run an Engine
      # consumer, start the packed CLI --help. Node-22 only — the check is
      # node-version independent, same as packaging/viability.
      - name: Isolated-consumer proof (packed tarball)
        if: matrix.node-version == 22
        run: node scripts/verify-isolated-consumer.mjs

      - if: matrix.node-version != 22
        run: npm run test

      # Coverage thresholds in vitest.config.ts act as a ratchet: this step
      # goes red if coverage regresses below the floors recorded there.
      - name: Coverage
        if: matrix.node-version == 22
        run: npx vitest run --coverage

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false

  # Dedicated job (not a fifth workflow file — the org already carries 4 vs
  # the 2-file guideline in docs-integrity.yml). Proves the CLI image boots
  # before a Dockerfile-only PR can merge. load:true / push:false: never
  # publishes. Native-arch only (ubuntu-latest amd64) — multi-arch GHCR
  # push lives on release.yml. Smoke fail fails the job.
  docker-smoke:
    name: Docker smoke (CLI image)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build CLI image (load, no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          push: false
          tags: ai-rpg-engine:ci-smoke
          build-args: |
            GIT_SHA=${{ github.sha }}
            VCS_REF=${{ github.sha }}
            SOURCE_DATE_EPOCH=0

      - name: Smoke — CLI --help
        run: docker run --rm ai-rpg-engine:ci-smoke --help

      # Write verb against /tmp (USER node cannot write WORKDIR /app).
      # --out is the real flag; a cwd-write would EACCES.
      - name: Smoke — create-starter writes under /tmp
        run: docker run --rm ai-rpg-engine:ci-smoke create-starter ci-smoke --out /tmp/ci-smoke

      # Image CVE gate: OS + library HIGH/CRITICAL on the loaded tag.
      # ignore-unfixed stays off — the FROM digest pin is the known snapshot,
      # not a silent ignore of whatever Hub serves today.
      - name: Scan CLI image (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai-rpg-engine:ci-smoke
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '1'
