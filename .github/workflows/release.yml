name: Release

# Publishes every @ai-rpg-engine/* package to npm via OIDC Trusted Publishing
# (no long-lived token) and the CLI image to GHCR. Fires on a published GitHub
# Release (including prereleases — those publish with --tag next and never
# retag `latest`). workflow_dispatch offers a dry-run to validate the pipeline
# first.
#
# Kept separate from ci.yml/pages.yml (dogfood-swarm F-a160dfa6, one of 4
# workflow files vs the org's 2-file guideline): this is the only workflow
# triggered by `release: published`. npm OIDC and GHCR credentials are
# job-scoped — a compromised docker/* action cannot mint the npm provenance
# token, and the docker job cannot push when npm is red (`needs: [npm]`).
on:
  release:
    # `published` fires for full releases AND prereleases. `released` would
    # drop the prerelease path (npm --tag next / image semver only). Latest
    # dist-tag and GHCR `latest` are gated on prerelease == false below.
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only (npm publish --dry-run, docker build without push)'
        type: boolean
        default: true

# Default is contents: read. Credential writes live on the job that needs
# them: npm gets id-token (OIDC), docker gets packages (GHCR).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Force the docker/* JS actions (login/metadata/build-push) onto Node 24 — they
# still ship Node 20 entrypoints, which GitHub removes from runners on 2026-09-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  npm:
    name: Publish npm packages (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC). GHCR push stays on docker.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Pinned to the production LTS the ci.yml matrix actually exercises
          # (matrix is [22, 24]; 22 remains the single-leg gate runner).
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing requires npm >=11.5 (OIDC). Pin an EXACT 11.x
      # version with --ignore-scripts — never a floating latest tag. This job
      # holds the npm OIDC token; a floating latest resolves whatever tree is
      # newest at install time (no lockfile, no integrity pin). Stay on 11.x:
      # check-packaging.mjs already special-cases npm 12's pack --json shape,
      # but the publish tool itself should not float onto that line unannounced.
      - name: Install pinned npm for OIDC
        run: npm install -g npm@11.19.1 --ignore-scripts

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Typecheck test files
        run: npm run typecheck:tests
      - name: Release gate — mixed-game viability proof
        run: node scripts/verify-mixed-game-viability.mjs
      - run: npm test

      # Packaging gate (PG-5): refuse to publish any package whose tarball
      # lacks LICENSE, README.md, or advertised main/types/bin/exports paths.
      # npm silently drops `files` entries that don't exist on disk — this
      # dry-run inspection is the only reliable check, and it is the gate
      # that would have caught the G3 LICENSE gap before it reached npm.
      - name: Packaging gate (LICENSE/README + advertised entry points)
        run: node scripts/check-packaging.mjs

      # Packed-tarball consumer proof (SHIP_GATE §F) — same script ci.yml
      # runs on the node-22 leg. Must pass before any npm publish.
      - name: Isolated-consumer proof (packed tarball)
        run: node scripts/verify-isolated-consumer.mjs

      # Idempotent per-package publish: skip private packages and any version
      # already on npm, so a re-run after a partial failure completes the release
      # without erroring on already-published packages. Real publish errors still
      # halt the job (bash -e). npm view failures that are NOT "version not
      # found" fail the step instead of falling through to a credentialed write.
      - name: Publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          set -euo pipefail
          for dir in packages/* templates/*; do
            [ -f "$dir/package.json" ] || continue
            priv=$(node -p "require('./$dir/package.json').private === true")
            [ "$priv" = "true" ] && { echo "skip private $dir"; continue; }
            name=$(node -p "require('./$dir/package.json').name")
            echo "::group::dry-run $name"
            npm publish -w "$name" --access public --provenance --dry-run
            echo "::endgroup::"
          done

      - name: Publish (live, idempotent)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          for dir in packages/* templates/*; do
            [ -f "$dir/package.json" ] || continue
            priv=$(node -p "require('./$dir/package.json').private === true")
            [ "$priv" = "true" ] && { echo "skip private $dir"; continue; }
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            ver_core="${ver%%+*}"
            TAG_ARGS=()
            if [ "${RELEASE_PRERELEASE:-}" = "true" ] || [[ "$ver_core" == *-* ]]; then
              TAG_ARGS=(--tag next)
            fi
            view_out=""
            view_ec=0
            view_out="$(npm view "$name@$ver" version 2>&1)" && view_ec=0 || view_ec=$?
            if [ "$view_ec" -eq 0 ]; then
              echo "skip $name@$ver — already on registry"
              continue
            fi
            unpublished=0
            if echo "$view_out" | grep -Eq 'code E404|E404|404 Not Found|is not in this registry|version not found'; then
              unpublished=1
            elif echo "$view_out" | grep -q 'E403' && echo "$view_out" | grep -Eqi 'not found|not in this registry|version not found'; then
              unpublished=1
            fi
            if [ "$unpublished" -ne 1 ]; then
              echo "::error::npm view $name@$ver failed with exit $view_ec (not a version-not-found signal) — refusing to publish"
              echo "$view_out"
              exit 1
            fi
            if [ ${#TAG_ARGS[@]} -gt 0 ]; then
              echo "publish $name@$ver — not on registry (tag next)"
            else
              echo "publish $name@$ver — not on registry"
            fi
            echo "::group::publish $name@$ver"
            npm publish -w "$name" --access public --provenance "${TAG_ARGS[@]}"
            echo "::endgroup::"
          done

      # Live path only: prove the advertised `npm i -g @ai-rpg-engine/cli`
      # installs from registry.npmjs.org (not the packed-from-disk proof).
      # Isolated-consumer.mjs stays the tarball-on-disk gate; do not fold this in.
      - name: Registry round-trip — npm install CLI from registry
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        timeout-minutes: 10
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          ver=$(node -p "require('./packages/cli/package.json').version")
          prefix=$(mktemp -d)
          echo "installing @ai-rpg-engine/cli@$ver from https://registry.npmjs.org into $prefix"
          delays=(5 10 20 30 45 45)
          max_attempts=$(( ${#delays[@]} + 1 ))
          attempt=1
          while true; do
            install_out=""
            install_ec=0
            install_out="$(npm install -g --prefix "$prefix" --registry=https://registry.npmjs.org "@ai-rpg-engine/cli@$ver" 2>&1)" && install_ec=0 || install_ec=$?
            echo "$install_out"
            retry_reason=""
            if [ "$install_ec" -ne 0 ]; then
              if ! grep -Eq '(^|[^A-Za-z0-9_])(E404|ETARGET)([^A-Za-z0-9_]|$)' <<<"$install_out"; then
                echo "::error::npm install -g @ai-rpg-engine/cli@$ver failed with non-propagation error (exit $install_ec)"
                exit 1
              fi
              retry_reason="E404/ETARGET"
            else
              check_ec=0
              node - "$prefix" "$ver" <<'EOF' || check_ec=$?
          const fs = require('node:fs');
          const path = require('node:path');

          function failFatal(msg) {
            console.error(`::error::${msg}`);
            process.exit(1);
          }

          function readJsonSafe(filePath, label) {
            try {
              return JSON.parse(fs.readFileSync(filePath, 'utf8'));
            } catch (err) {
              const detail = err && typeof err.message === 'string' ? err.message : String(err);
              return failFatal(`Cannot read ${label} (${filePath}): ${detail}`);
            }
          }

          function resolveScopedDep(fromPkgDir, depName, nmParent) {
            const parts = depName.split('/');
            let cur = path.resolve(fromPkgDir);
            const rootResolved = path.resolve(nmParent);
            while (true) {
              const candidate = path.join(cur, 'node_modules', ...parts);
              if (fs.existsSync(candidate)) {
                const pkgJson = path.join(candidate, 'package.json');
                if (!fs.existsSync(pkgJson)) {
                  failFatal(`Installed ${depName} at ${candidate} is missing its package.json`);
                }
                return { pkgDir: candidate, pkgJson };
              }
              if (cur === rootResolved) break;
              const parent = path.dirname(cur);
              if (parent === cur || !cur.startsWith(rootResolved + path.sep)) break;
              cur = parent;
            }
            return failFatal(`Missing installed package ${depName}/package.json starting from ${fromPkgDir}`);
          }

          function collectTreeDirs(rootNmDir, outDirs) {
            if (!fs.existsSync(rootNmDir)) return;
            const stack = [rootNmDir];
            while (stack.length > 0) {
              const nmDir = stack.pop();
              let entries;
              try {
                entries = fs.readdirSync(nmDir, { withFileTypes: true });
              } catch (err) {
                const detail = err && typeof err.message === 'string' ? err.message : String(err);
                failFatal(`Cannot scan node_modules at ${nmDir}: ${detail}`);
              }
              for (const entry of entries) {
                if (entry.isSymbolicLink() || !entry.isDirectory()) continue;
                if (entry.name === '@ai-rpg-engine') {
                  const scopePath = path.join(nmDir, entry.name);
                  const scoped = fs.readdirSync(scopePath, { withFileTypes: true });
                  for (const pkgEntry of scoped) {
                    if (pkgEntry.isSymbolicLink() || !pkgEntry.isDirectory()) continue;
                    const pkgDir = path.join(scopePath, pkgEntry.name);
                    const pkgJson = path.join(pkgDir, 'package.json');
                    if (!fs.existsSync(pkgJson)) {
                      failFatal(`Installed @ai-rpg-engine/${pkgEntry.name} at ${pkgDir} is missing its package.json`);
                    }
                    outDirs.add(path.resolve(pkgDir));
                    const nestedNm = path.join(pkgDir, 'node_modules');
                    if (fs.existsSync(nestedNm)) stack.push(nestedNm);
                  }
                } else if (entry.name.startsWith('@')) {
                  const scopePath = path.join(nmDir, entry.name);
                  const scoped = fs.readdirSync(scopePath, { withFileTypes: true });
                  for (const pkgEntry of scoped) {
                    if (pkgEntry.isSymbolicLink() || !pkgEntry.isDirectory()) continue;
                    const nestedNm = path.join(scopePath, pkgEntry.name, 'node_modules');
                    if (fs.existsSync(nestedNm)) stack.push(nestedNm);
                  }
                } else if (entry.name !== '.bin') {
                  const nestedNm = path.join(nmDir, entry.name, 'node_modules');
                  if (fs.existsSync(nestedNm)) stack.push(nestedNm);
                }
              }
            }
          }

          try {
            const [prefixDir, expectedVer] = process.argv.slice(2);
            const cliRel = ['@ai-rpg-engine', 'cli', 'package.json'];
            const nmRoot = [
              path.join(prefixDir, 'lib', 'node_modules'),
              path.join(prefixDir, 'node_modules'),
            ].find((dir) => fs.existsSync(path.join(dir, ...cliRel)));
            if (!nmRoot) {
              failFatal(`Installed @ai-rpg-engine/cli/package.json not found under ${prefixDir}`);
            }
            const nmParent = path.dirname(nmRoot);
            const cliDir = path.join(nmRoot, '@ai-rpg-engine', 'cli');
            const cliPkgPath = path.join(cliDir, 'package.json');
            const cliPkg = readJsonSafe(cliPkgPath, '@ai-rpg-engine/cli/package.json');
            if (cliPkg.version !== expectedVer) {
              console.error(`::error::Installed @ai-rpg-engine/* versions do not match ${expectedVer}: @ai-rpg-engine/cli@${cliPkg.version}`);
              process.exit(2);
            }

            // CLI dependencies are "*", so `--tag next` prerelease installs (flagged via
            // GitHub `release.prerelease` or carrying a hyphenated semver prerelease tag)
            // resolve sibling packages to `latest` instead of prereleases. Verify the CLI
            // itself for prereleases and skip sibling version parity.
            const isPrerelease =
              process.env.RELEASE_PRERELEASE === 'true' ||
              expectedVer.split('+')[0].includes('-');
            if (isPrerelease) {
              console.log(`verified @ai-rpg-engine/cli@${expectedVer} (prerelease build; skipping sibling version check because "*" dependencies resolve to latest)`);
              process.exit(0);
            }

            const visitedDirs = new Set();
            const queue = [path.resolve(cliDir)];
            const treeDirs = new Set();
            collectTreeDirs(nmRoot, treeDirs);
            for (const d of treeDirs) queue.push(d);

            const mismatches = [];
            while (queue.length > 0) {
              const pkgDir = queue.pop();
              const resolvedDir = path.resolve(pkgDir);
              if (visitedDirs.has(resolvedDir)) continue;
              visitedDirs.add(resolvedDir);

              const pkgJsonPath = path.join(resolvedDir, 'package.json');
              if (!fs.existsSync(pkgJsonPath)) {
                failFatal(`Installed package at ${resolvedDir} is missing its package.json`);
              }
              const pkg = readJsonSafe(pkgJsonPath, pkgJsonPath);
              const pkgName = pkg.name || `@ai-rpg-engine/${path.basename(resolvedDir)}`;
              if (pkg.version !== expectedVer) {
                const rel = path.relative(nmRoot, resolvedDir);
                mismatches.push(`${pkgName}@${pkg.version} (${rel})`);
              }
              for (const depName of Object.keys(pkg.dependencies || {})) {
                if (!depName.startsWith('@ai-rpg-engine/')) continue;
                const resolved = resolveScopedDep(resolvedDir, depName, nmParent);
                queue.push(resolved.pkgDir);
              }
            }

            if (mismatches.length > 0) {
              console.error(`::error::Installed @ai-rpg-engine/* versions do not match ${expectedVer}: ${mismatches.join(', ')}`);
              process.exit(2);
            }
            console.log(`verified ${visitedDirs.size} @ai-rpg-engine/* packages at ${expectedVer}`);
          } catch (err) {
            const detail = err && typeof err.message === 'string' ? err.message : String(err);
            failFatal(`Unexpected version verification error: ${detail}`);
          }
          EOF
              if [ "$check_ec" -eq 0 ]; then
                break
              fi
              if [ "$check_ec" -ne 2 ]; then
                echo "::error::Installed @ai-rpg-engine/cli@$ver failed verification cleanly without retry (exit $check_ec)"
                exit 1
              fi
              retry_reason="stale @ai-rpg-engine/* package version"
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::npm install -g @ai-rpg-engine/cli@$ver failed after $attempt attempts (${retry_reason})"
              exit 1
            fi
            rm -rf "$prefix"
            prefix=$(mktemp -d)
            delay=${delays[$((attempt - 1))]}
            echo "npm install attempt $attempt hit ${retry_reason}; waiting ${delay}s for registry propagation"
            sleep "$delay"
            attempt=$((attempt + 1))
          done
          PATH="$prefix/bin:$PATH" ai-rpg-engine --help

  docker:
    name: Build & push CLI image (GHCR)
    needs: [npm]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # GHCR docker push. npm OIDC stays on the npm job.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name != 'release' || github.event.release.prerelease == false }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      # Native-arch load so smoke can docker-run before any push. Dry-run
      # dispatch builds without pushing. Live publish is a second
      # build-push-action (multi-arch, sbom + provenance) after --help,
      # create-starter, and trivy exit 0. This job must not hold npm OIDC
      # (Trusted Publishing binds the workflow file, not the job name).
      - name: Build CLI image (load, no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          push: false
          tags: ai-rpg-engine:ci-smoke
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VCS_REF=${{ github.sha }}
            SOURCE_DATE_EPOCH=0

      - name: Smoke — CLI --help
        run: docker run --rm ai-rpg-engine:ci-smoke --help

      - name: Smoke — create-starter writes under /tmp
        run: docker run --rm ai-rpg-engine:ci-smoke create-starter ci-smoke --out /tmp/ci-smoke

      # Image CVE gate before GHCR latest can move. Same policy as ci.yml:
      # fail on HIGH/CRITICAL that have a published fix; ignore Debian
      # unfixed/will_not_fix; skip Node's bundled npm (not our lockfile).
      - name: Scan CLI image (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai-rpg-engine:ci-smoke
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          skip-dirs: /usr/local/lib/node_modules/npm
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Push multi-arch image (SBOM + provenance)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          load: false
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VCS_REF=${{ github.sha }}
            SOURCE_DATE_EPOCH=0

      # Live path only: drop the locally loaded tags and re-pull the GHCR
      # tag the public installs, then --help. Skip on dry-run.
      - name: Registry round-trip — GHCR pull + --help
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          docker rmi ai-rpg-engine:ci-smoke || true
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker rmi "$tag" || true
          done <<< "$META_TAGS"
          primary=$(printf '%s\n' "$META_TAGS" | awk 'NF { print; exit }')
          [ -n "$primary" ] || { echo "::error::no GHCR tag from metadata-action"; exit 1; }
          docker pull "$primary"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$primary")
          docker run --rm "$digest" --help
